name: Build ISO (ARM64)

on:
  workflow_dispatch:
    inputs:
      iso_name:
        description: "Release tag (default: iso-arm-<run number>)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths: [ "VERSION", "flake.nix", "flake.lock", "configuration.nix", "nix/**", "src/**", "Makefile", "branding/**", "tests/**", ".github/workflows/build-nixos-iso-arm.yml" ]

permissions:
  contents: write

jobs:
  build-iso-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Test the C tools
        run: |
          make
          bash tests/run.sh

      - name: Install Nix (flakes)
        uses: DeterminateSystems/nix-installer-action@main


      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true

      - name: Build the installed system (smoke test, no disk needed)
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#toplevel -L --no-link
          nix --extra-experimental-features 'nix-command flakes' build .#toplevel-light -L --no-link
          echo "OK: the ARM64 system builds cleanly."

      - name: Build the installer ISO (aarch64)
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#iso -L
          ls -lh result/iso/*.iso

      # The image is booted by UEFI in QEMU on the runner itself, until the
      # installer prints its first screen on the serial console.
      - name: Boot the image in QEMU (UEFI)
        run: |
          fwdir=$(nix --extra-experimental-features 'nix-command flakes' build --inputs-from . nixpkgs#OVMF.fd --no-link --print-out-paths | head -1)
          fw="$fwdir/FV/QEMU_EFI.fd"
          echo "firmware: $fw"; test -s "$fw"
          accel=tcg; cpu=cortex-a72
          if [ -w /dev/kvm ]; then accel=kvm; cpu=host; fi
          echo "accelerator: $accel"
          nix --extra-experimental-features 'nix-command flakes' shell --inputs-from . nixpkgs#qemu --command \
            qemu-system-aarch64 -M virt -accel "$accel" -cpu "$cpu" -smp 4 -m 3072 \
              -bios "$fw" -cdrom result/iso/*.iso -boot d -display none -serial file:boot.log -monitor none &
          qemu=$!
          for i in $(seq 1 150); do
            sleep 10
            if grep -aqE 'Installer.*build' boot.log && grep -aq 'English' boot.log; then echo "the installer is up after $((i*10)) s"; break; fi
            if ! kill -0 $qemu 2>/dev/null; then echo "QEMU exited"; break; fi
          done
          kill $qemu 2>/dev/null || true
          echo "--- last lines of the serial console ---"
          tail -c 4000 boot.log | tr -cd '[:print:]\n' | tail -40
          grep -aqE 'Installer.*build' boot.log && grep -aq 'English' boot.log

      - name: Keep the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-boot-log-run${{ github.run_number }}
          path: boot.log
          if-no-files-found: ignore

      - name: Which build is this? (job summary)
        run: |
          {
            echo "### SnapOS installer ISO for ARM64 — run #${{ github.run_number }}"
            echo ""
            echo "- commit: \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s)"
            echo "- release: \`${{ github.event.inputs.iso_name != '' && github.event.inputs.iso_name || format('iso-arm-{0}', github.run_number) }}\` (draft)"
            echo "- sha256: \`$(sha256sum result/iso/*.iso | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A draft release holds the plain .iso file (an Actions artifact would be
      # wrapped in a zip). Only the repository owner sees drafts.
      - name: Attach the ISO to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp result/iso/*.iso snapos-installer-aarch64.iso
          sha256sum snapos-installer-aarch64.iso > snapos-installer-aarch64.iso.sha256
          # the source package that `snapos update` installs, with its checksum
          git archive --format=tar.gz --prefix=snapos/ -o snapos-source.tar.gz "$GITHUB_SHA"
          sha256sum snapos-source.tar.gz > snapos-source.tar.gz.sha256
          # how the release describes itself to `snapos update` (no GitHub API needed)
          printf 'commit=%s\nversion=%s\nname=SnapOS installer V%s\ndate=%s\n' \
            "$GITHUB_SHA" "$(cat VERSION)" "$(cat VERSION)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > snapos-release.txt
          tag="${{ github.event.inputs.iso_name != '' && github.event.inputs.iso_name || format('iso-arm-{0}', github.run_number) }}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "SnapOS installer ARM64 ${GITHUB_SHA::7}" \
            --notes "Draft. Built by run #${{ github.run_number }} from commit ${GITHUB_SHA::7}. Flash with balenaEtcher." \
            snapos-installer-aarch64.iso snapos-installer-aarch64.iso.sha256 snapos-source.tar.gz snapos-source.tar.gz.sha256 snapos-release.txt
